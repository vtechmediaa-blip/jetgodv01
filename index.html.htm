  <!-- Background Motion Engine -->
  <script>
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');
    let width, height;

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let t = 0;
    function animate() {
      t += 0.01;
      ctx.fillStyle = '#040814';
      ctx.fillRect(0, 0, width, height);

      const grad1 = ctx.createRadialGradient(
        width * 0.3 + Math.sin(t) * 80, 
        height * 0.4 + Math.cos(t * 0.8) * 80, 
        10, 
        width * 0.3, 
        height * 0.4, 
        320
      );
      grad1.addColorStop(0, 'rgba(250, 204, 21, 0.25)');
      grad1.addColorStop(1, 'transparent');

      const grad2 = ctx.createRadialGradient(
        width * 0.7 + Math.cos(t * 1.2) * 80, 
        height * 0.6 + Math.sin(t * 0.9) * 80, 
        10, 
        width * 0.7, 
        height * 0.6, 
        350
      );
      grad2.addColorStop(0, 'rgba(59, 130, 246, 0.3)');
      grad2.addColorStop(1, 'transparent');

      ctx.fillStyle = grad1;
      ctx.beginPath();
      ctx.arc(width * 0.5, height * 0.5, width, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = grad2;
      ctx.beginPath();
      ctx.arc(width * 0.5, height * 0.5, width, 0, Math.PI * 2);
      ctx.fill();

      requestAnimationFrame(animate);
    }
    animate();
  </script>
